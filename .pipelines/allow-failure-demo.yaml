pipeline:
  name: allow-failure-demo
  description: >
    Demonstrates allow_failure behavior.
    - lint fails but allow_failure: true, pipeline still succeeds
    - compile succeeds normally
    - test succeeds normally

stages:
  - build
  - test

lint:
  stage: build
  image: alpine:3.19
  allow_failure: true
  script:
    - echo "Running lint (this will fail intentionally)..."
    - exit 1

compile:
  stage: build
  image: alpine:3.19
  needs: [lint]
  script:
    - echo "Compiling (this succeeds)..."
    - echo "Build complete"

unit-test:
  stage: test
  image: alpine:3.19
  script:
    - echo "Running tests..."
    - echo "All tests passed"
