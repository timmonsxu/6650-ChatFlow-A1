pipeline:
  name: java-success
  description: Maven compile and test for ChatFlow server module

stages:
  - build
  - test

compile:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "Compiling server module..."
    - mvn -B compile -f server/pom.xml

run-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "Running server unit tests..."
    - mvn -B test -f server/pom.xml
